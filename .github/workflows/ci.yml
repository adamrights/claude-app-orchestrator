name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Validate knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # All scripts are zero-dependency Node ESM — no npm install needed.
      - name: Skill map in sync with manifest
        run: node scripts/build-skill-map.mjs --check

      - name: Cross-references (agents ↔ skills ↔ templates ↔ blueprints)
        run: node scripts/check-references.mjs

      - name: Validate every blueprint
        run: |
          status=0
          for f in blueprints/examples/*.yaml examples/built/*/blueprint.yaml; do
            [ -e "$f" ] || continue
            echo "validating $f"
            node scripts/validate-blueprint.mjs "$f" || status=1
          done
          exit $status
